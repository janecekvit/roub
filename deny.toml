# cargo-deny: RustSec advisories and licences are checked in CI, like NuGetAudit in mcp-windbg.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# libFuzzer is LLVM code under the permissive NCSA licence. It is linked only into the fuzz
# targets in fuzz/, never into a roub binary, so the exception is scoped to that one crate.
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
