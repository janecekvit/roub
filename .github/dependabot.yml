version: 2

# Every ecosystem waits 14 days after a release before proposing it, so a compromised or broken
# release has time to be yanked first. Security updates are not delayed.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      grpc:
        patterns: ["tonic*", "prost*", "protoc-bin-vendored"]
      tokio:
        patterns: ["tokio*"]
      tracing:
        patterns: ["tracing*"]

  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
