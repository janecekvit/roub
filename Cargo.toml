[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Vít Janeček"]
repository = "https://github.com/janecekvit/roub"
homepage = "https://github.com/janecekvit/roub"

[workspace.dependencies]
roub-core = { path = "crates/roub-core", version = "0.1.0" }
roub-proto = { path = "crates/roub-proto", version = "0.1.0" }

anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
prost = "0.14.4"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
protoc-bin-vendored = "3.3.0"
thiserror = "2.0.21"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
